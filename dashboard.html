<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Progress Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  /* ============================================================
     TOKENS
  ============================================================ */
  :root{
    --bg:            #F3F1EC;
    --surface:       #FFFFFF;
    --ink:           #16202B;
    --ink-soft:      #4C5A67;
    --line:          #D8D3C7;
    --line-soft:     #E7E3D8;
    --navy:          #1B3A5C;
    --navy-deep:     #10263D;
    --orange:        #E15A2D;
    --steel:         #7C97AE;
    --green:         #4B7A5B;
    --amber:         #C68A1E;
    --radius:        2px;
    --gap:           20px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    font-variant-numeric: tabular-nums;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  a{color:inherit;}

  /* Blueprint grid backdrop for the header only */
  .blueprint{
    background-color:var(--navy-deep);
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size:28px 28px;
  }

  /* Technical corner-bracket frame, used sparingly on the hero stat */
  .bracketed{
    position:relative;
  }
  .bracketed::before,
  .bracketed::after{
    content:"";
    position:absolute;
    width:14px; height:14px;
    border-color:var(--orange);
    border-style:solid;
    border-width:0;
  }
  .bracketed::before{
    top:-1px; left:-1px;
    border-top-width:2px; border-left-width:2px;
  }
  .bracketed::after{
    bottom:-1px; right:-1px;
    border-bottom-width:2px; border-right-width:2px;
  }

  .wrap{max-width:1240px; margin:0 auto; padding:0 28px;}

  /* ============================================================
     HEADER
  ============================================================ */
  header.blueprint{padding:36px 0 30px;}
  .header-row{
    display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap;
  }
  .kicker{
    color:var(--steel); font-size:12.5px; letter-spacing:0.02em; margin-bottom:8px;
  }
  .project-title{
    color:#fff; font-size:32px; line-height:1.15;
  }
  .project-sub{
    color:rgba(255,255,255,0.6); font-size:14px; margin-top:6px;
  }
  .status-pill{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid rgba(255,255,255,0.25);
    color:#fff; font-size:12.5px;
    padding:6px 12px; border-radius:20px;
    margin-top:14px;
  }
  .status-dot{width:7px; height:7px; border-radius:50%; background:var(--orange);}
  .status-pill.ok .status-dot{background:#7ED08C;}

  .hero-stats{display:flex; gap:14px;}
  .stat-box{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    padding:16px 22px;
    min-width:120px;
  }
  .stat-box .num{
    font-family:'Space Grotesk', sans-serif;
    font-size:30px; font-weight:700; color:#fff;
  }
  .stat-box.actual .num{color:var(--orange);}
  .stat-box .lbl{font-size:11.5px; color:rgba(255,255,255,0.55); margin-top:4px;}

  /* ============================================================
     LAYOUT
  ============================================================ */
  main{padding:30px 0 60px;}
  .grid{
    display:grid;
    grid-template-columns: 300px 1fr;
    gap:var(--gap);
  }
  @media (max-width: 880px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    padding:22px;
  }
  .panel + .panel{margin-top:var(--gap);}
  .panel-title{
    font-size:15px; font-weight:600;
    display:flex; align-items:center; gap:8px;
    margin-bottom:16px;
    padding-bottom:12px;
    border-bottom:1px solid var(--line-soft);
  }
  .panel-title .tick{
    width:8px; height:8px; background:var(--orange); flex:none;
  }

  /* Info table */
  .info-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .info-table tr{border-bottom:1px solid var(--line-soft);}
  .info-table tr:last-child{border-bottom:none;}
  .info-table td{padding:9px 0; vertical-align:top;}
  .info-table td:first-child{color:var(--ink-soft); width:44%;}
  .info-table td:last-child{font-weight:500; text-align:right;}

  /* Timeline */
  .timeline{position:relative; padding-left:2px;}
  .tl-item{
    position:relative; padding:0 0 20px 22px; border-left:2px solid var(--line);
  }
  .tl-item:last-child{border-color:transparent; padding-bottom:0;}
  .tl-item::before{
    content:""; position:absolute; left:-6px; top:2px;
    width:10px; height:10px; border-radius:50%;
    background:var(--surface); border:2px solid var(--steel);
  }
  .tl-item.done::before{background:var(--green); border-color:var(--green);}
  .tl-item.active::before{background:var(--orange); border-color:var(--orange);}
  .tl-item .tl-date{font-size:11.5px; color:var(--ink-soft);}
  .tl-item .tl-name{font-size:13.5px; font-weight:600; margin-top:2px;}

  /* Parties */
  .party{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px;
  }
  .party:last-child{border-bottom:none;}
  .party-role{color:var(--ink-soft); font-size:11.5px;}
  .party-name{font-weight:600; margin-top:2px;}
  .tag{
    font-size:10.5px; padding:3px 8px; border:1px solid var(--line);
    color:var(--ink-soft);
  }

  /* Progress chart panel */
  .chart-panel{grid-column: 2 / 3;}
  @media (max-width: 880px){ .chart-panel{grid-column:1;} }
  .chart-wrap{height:280px; position:relative;}
  .legend-row{display:flex; gap:18px; margin-top:14px; font-size:12px; color:var(--ink-soft);}
  .legend-row span{display:inline-flex; align-items:center; gap:6px;}
  .legend-sw{width:10px; height:10px;}

  .deviation-note{
    margin-top:16px; padding:12px 14px;
    background:#FBF3EC; border-left:3px solid var(--orange);
    font-size:13px; color:var(--ink);
  }

  /* Notes */
  .notes-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
  @media (max-width: 700px){ .notes-grid{grid-template-columns:1fr;} }
  .note-card h4{font-size:13px; font-weight:600; margin-bottom:8px;}
  .note-card ul{margin:0; padding-left:16px; font-size:13px; color:var(--ink-soft);}
  .note-card li{margin-bottom:5px;}

  /* Photo galleries */
  .tabs{display:flex; gap:4px; margin-bottom:16px;}
  .tab-btn{
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    padding:8px 16px;
  }
  .tab-btn.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .photo-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px;
  }
  .photo-tile{
    position:relative; border:1px solid var(--line); background:#eee;
  }
  .photo-tile img{
    width:100%; height:110px; object-fit:cover; display:block;
  }
  .photo-src{
    position:absolute; bottom:0; left:0;
    font-size:9.5px; letter-spacing:0.02em; color:#fff;
    background:rgba(16,38,61,0.72);
    padding:2px 6px;
  }
  .photo-tabset{display:none;}
  .photo-tabset.active{display:block;}

  footer{
    text-align:center; font-size:11.5px; color:var(--ink-soft);
    padding:20px 0 36px;
  }
</style>
</head>
<body>

<header class="blueprint">
  <div class="wrap">
    <div class="header-row">
      <div>
        <div class="kicker" id="kicker">WEEKLY PROGRESS &mdash; SITE DASHBOARD</div>
        <h1 class="project-title" id="projectTitle">Loading project&hellip;</h1>
        <div class="project-sub" id="projectSub"></div>
        <div class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">Checking status</span></div>
      </div>
      <div class="hero-stats bracketed">
        <div class="stat-box actual"><div class="num" id="actualPct">&mdash;</div><div class="lbl">Actual complete</div></div>
        <div class="stat-box"><div class="num" id="planPct">&mdash;</div><div class="lbl">Planned complete</div></div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid">

    <!-- LEFT COLUMN -->
    <div>
      <div class="panel">
        <div class="panel-title"><span class="tick"></span>Project information</div>
        <table class="info-table" id="infoTable"></table>
      </div>

      <div class="panel">
        <div class="panel-title"><span class="tick"></span>Parties engaged</div>
        <div id="partiesList"></div>
      </div>

      <div class="panel">
        <div class="panel-title"><span class="tick"></span>Schedule</div>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div>
      <div class="panel">
        <div class="panel-title"><span class="tick"></span>Progress by work category</div>
        <div class="chart-wrap"><canvas id="progressChart"></canvas></div>
        <div class="legend-row">
          <span><span class="legend-sw" style="background:var(--steel)"></span>Plan %</span>
          <span><span class="legend-sw" style="background:var(--orange)"></span>Actual %</span>
        </div>
        <div class="deviation-note" id="deviationNote" style="display:none;"></div>
      </div>

      <div class="panel">
        <div class="panel-title"><span class="tick"></span>Notes</div>
        <div class="notes-grid" id="notesGrid"></div>
      </div>

      <div class="panel">
        <div class="panel-title"><span class="tick"></span>Site photos</div>
        <div class="tabs">
          <button class="tab-btn active" data-tab="this">This week</button>
          <button class="tab-btn" data-tab="last">Last week</button>
        </div>
        <div class="photo-tabset active" id="tab-this"><div class="photo-grid" id="photosThis"></div></div>
        <div class="photo-tabset" id="tab-last"><div class="photo-grid" id="photosLast"></div></div>
      </div>
    </div>

  </div>
</main>

<footer>Updated automatically from Supabase &middot; <span id="lastSync">&mdash;</span></footer>

<script type="module">
/* ================================================================
   CONFIG
   Fill in your Supabase project URL + anon key to connect live data.
   Expected tables (adjust the query functions below if yours differ):

   projects            (id, name, code, contractor_sipil, contractor_mep,
                         period_start, period_end, target_live, status)
   progress_categories (project_id, category, plan_pct, actual_pct, sort_order)
   milestones          (project_id, name, date, state)  -- state: done | active | upcoming
   notes               (project_id, heading, body, sort_order)
   photos              (project_id, week, source, ref, caption)
                         -- week:   'this' | 'last'
                         -- source: 'storage' | 'drive'
                         -- ref:    for 'storage' -> the path inside STORAGE_BUCKET
                         --                          e.g. "riverside-mall/img012.jpg"
                         --         for 'drive'   -> the Drive file's share link OR bare file ID
                         --                          e.g. "https://drive.google.com/file/d/1AbC.../view"
                         --                          Drive files must be shared "Anyone with the link"
                         --                          for their thumbnail to render without auth.
================================================================ */
const SUPABASE_URL = "";       // e.g. "https://xxxx.supabase.co"
const SUPABASE_ANON_KEY = "";  // your anon/public key
const PROJECT_ID = "";         // the project row this dashboard displays
const STORAGE_BUCKET = "site-photos"; // Supabase Storage bucket holding uploaded photos

/* ---------------------------------------------------------------
   DEMO DATA — shown until Supabase is configured, or if a fetch fails.
   Replace freely, or delete once your Supabase data is flowing.
--------------------------------------------------------------- */
const DEMO = {
  project:{
    name:"Retail Fit-Out — Riverside Mall",
    code:"RFO-2026-014",
    contractor_sipil:"PT. Mitra Konstruksi Indonesia",
    contractor_mep:"PT. Mitra Konstruksi Indonesia",
    period_start:"2026-05-14",
    period_end:"2026-06-08",
    target_live:"2026-06-09",
    status:"behind" // "on_track" | "behind"
  },
  categories:[
    {category:"Preliminary Works", plan_pct:100, actual_pct:100},
    {category:"Civil / Sipil", plan_pct:100, actual_pct:88},
    {category:"Fixture & Furniture", plan_pct:100, actual_pct:70},
    {category:"MEP", plan_pct:100, actual_pct:94},
    {category:"Signage", plan_pct:100, actual_pct:96},
    {category:"Utility", plan_pct:100, actual_pct:82},
    {category:"Equipment", plan_pct:100, actual_pct:12},
  ],
  milestones:[
    {name:"Ground break", date:"13 May 2026", state:"done"},
    {name:"Construction period", date:"14 May – 8 Jun 2026", state:"done"},
    {name:"Finish project", date:"4 Jun 2026", state:"active"},
    {name:"Training", date:"8 Jun 2026", state:"upcoming"},
    {name:"Target live", date:"9 Jun 2026", state:"upcoming"},
  ],
  notes:[
    {heading:"Civil progress", body:["Wall finishing in progress","Exterior paint application","Window & frame finishing"]},
    {heading:"MEP progress", body:["Piping installation with equipment set-up ongoing"]},
    {heading:"Equipment, utensils & IT", body:["Pending payment clearance before fabrication can proceed"]},
  ],
  photos:{
    this:[
      {url:"https://images.unsplash.com/photo-1541976590-713941681591?w=400&q=60", source:"storage"},
      {url:"https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=400&q=60", source:"storage"},
      {url:"https://images.unsplash.com/photo-1581094794329-c8112a89af12?w=400&q=60", source:"drive"},
      {url:"https://images.unsplash.com/photo-1590644365607-1c5a76c95c5f?w=400&q=60", source:"storage"},
    ],
    last:[
      {url:"https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=400&q=60", source:"storage"},
      {url:"https://images.unsplash.com/photo-1489514354504-1653aa90e34e?w=400&q=60", source:"storage"},
      {url:"https://images.unsplash.com/photo-1517581177682-a085bb7ffb15?w=400&q=60", source:"drive"},
      {url:"https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=400&q=60", source:"storage"},
    ]
  }
};

/* ---------------------------------------------------------------
   PHOTO URL RESOLUTION
   Storage photos: resolved to a public URL via the Supabase client.
   Drive photos: rewritten to Drive's thumbnail endpoint, which
   renders in a plain <img> tag as long as the file is shared
   "Anyone with the link can view".
--------------------------------------------------------------- */
function extractDriveFileId(ref){
  if(!ref) return null;
  const patterns = [/\/d\/([a-zA-Z0-9_-]+)/, /[?&]id=([a-zA-Z0-9_-]+)/];
  for(const p of patterns){
    const m = ref.match(p);
    if(m) return m[1];
  }
  // Assume the ref is already a bare file ID
  return /^[a-zA-Z0-9_-]{10,}$/.test(ref) ? ref : null;
}

function driveThumbnailUrl(ref, size=500){
  const id = extractDriveFileId(ref);
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${size}` : null;
}

function resolvePhotoUrl(row, supabase){
  if(row.source === "drive"){
    return driveThumbnailUrl(row.ref || row.url);
  }
  // default: storage
  if(supabase && row.ref){
    return supabase.storage.from(STORAGE_BUCKET).getPublicUrl(row.ref).data.publicUrl;
  }
  return row.url || row.ref; // already a full URL (e.g. demo data)
}

/* ---------------------------------------------------------------
   DATA LOADING
--------------------------------------------------------------- */
async function loadData(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY || !PROJECT_ID){
    return DEMO;
  }
  try{
    const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const [{data:project}, {data:categories}, {data:milestones}, {data:notes}, {data:photos}] = await Promise.all([
      supabase.from("projects").select("*").eq("id", PROJECT_ID).single(),
      supabase.from("progress_categories").select("*").eq("project_id", PROJECT_ID).order("sort_order"),
      supabase.from("milestones").select("*").eq("project_id", PROJECT_ID).order("date"),
      supabase.from("notes").select("*").eq("project_id", PROJECT_ID).order("sort_order"),
      supabase.from("photos").select("*").eq("project_id", PROJECT_ID),
    ]);

    if(!project) throw new Error("No project row found");

    const photosByWeek = {this:[], last:[]};
    (photos||[]).forEach(p => {
      const resolvedUrl = resolvePhotoUrl(p, supabase);
      if(resolvedUrl){
        (photosByWeek[p.week] ||= []).push({url: resolvedUrl, source: p.source, caption: p.caption});
      }
    });

    const notesGrouped = {};
    (notes||[]).forEach(n => {
      notesGrouped[n.heading] ||= [];
      notesGrouped[n.heading].push(n.body);
    });

    return {
      project,
      categories: categories?.length ? categories : DEMO.categories,
      milestones: milestones?.length ? milestones : DEMO.milestones,
      notes: notes?.length ? Object.entries(notesGrouped).map(([heading,body])=>({heading,body})) : DEMO.notes,
      photos: (photosByWeek.this.length || photosByWeek.last.length) ? photosByWeek : DEMO.photos,
    };
  }catch(err){
    console.warn("Supabase fetch failed, showing demo data:", err.message);
    return DEMO;
  }
}

/* ---------------------------------------------------------------
   RENDERING
--------------------------------------------------------------- */
function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString("en-GB",{day:"numeric", month:"short", year:"numeric"});
}

function render(data){
  const { project, categories, milestones, notes, photos } = data;

  document.getElementById("projectTitle").textContent = project.name;
  document.getElementById("projectSub").textContent =
    `${project.code || ""} · Construction period ${fmtDate(project.period_start)} – ${fmtDate(project.period_end)}`;

  const isOnTrack = project.status === "on_track";
  const pill = document.getElementById("statusPill");
  pill.classList.toggle("ok", isOnTrack);
  document.getElementById("statusText").textContent = isOnTrack ? "On track" : "Behind schedule";

  const planAvg = Math.round(categories.reduce((s,c)=>s+c.plan_pct,0)/categories.length);
  const actualAvg = Math.round(categories.reduce((s,c)=>s+c.actual_pct,0)/categories.length);
  document.getElementById("actualPct").textContent = actualAvg + "%";
  document.getElementById("planPct").textContent = planAvg + "%";

  document.getElementById("infoTable").innerHTML = `
    <tr><td>Project code</td><td>${project.code || "—"}</td></tr>
    <tr><td>Construction period</td><td>${fmtDate(project.period_start)} – ${fmtDate(project.period_end)}</td></tr>
    <tr><td>Target live</td><td>${fmtDate(project.target_live)}</td></tr>
  `;

  document.getElementById("partiesList").innerHTML = `
    <div class="party">
      <div><div class="party-role">Main contractor — civil</div><div class="party-name">${project.contractor_sipil || "—"}</div></div>
      <div class="tag">SIPIL</div>
    </div>
    <div class="party">
      <div><div class="party-role">Main contractor — MEP</div><div class="party-name">${project.contractor_mep || "—"}</div></div>
      <div class="tag">MEP</div>
    </div>
  `;

  document.getElementById("timeline").innerHTML = milestones.map(m => `
    <div class="tl-item ${m.state}">
      <div class="tl-date">${m.date}</div>
      <div class="tl-name">${m.name}</div>
    </div>
  `).join("");

  document.getElementById("notesGrid").innerHTML = notes.map(n => `
    <div class="note-card">
      <h4>${n.heading}</h4>
      <ul>${n.body.map(b=>`<li>${b}</li>`).join("")}</ul>
    </div>
  `).join("");

  const worstDeviation = categories.reduce((max,c) => {
    const dev = c.plan_pct - c.actual_pct;
    return dev > max.dev ? {dev, cat:c.category} : max;
  }, {dev:-Infinity, cat:null});
  if(worstDeviation.dev > 5){
    const el = document.getElementById("deviationNote");
    el.style.display = "block";
    el.textContent = `Largest deviation: ${worstDeviation.cat} is ${worstDeviation.dev}% behind plan.`;
  }

  function photoTile(p, weekLabel){
    const badge = p.source === "drive" ? "Drive" : "Upload";
    const alt = p.caption || `Site photo, ${weekLabel}`;
    return `
      <div class="photo-tile">
        <img src="${p.url}" loading="lazy" alt="${alt}">
        <span class="photo-src">${badge}</span>
      </div>`;
  }
  document.getElementById("photosThis").innerHTML = (photos.this||[]).map(p=>photoTile(p,"this week")).join("");
  document.getElementById("photosLast").innerHTML = (photos.last||[]).map(p=>photoTile(p,"last week")).join("");

  document.getElementById("lastSync").textContent = new Date().toLocaleString("en-GB",{dateStyle:"medium", timeStyle:"short"});

  renderChart(categories);
}

function renderChart(categories){
  const ctx = document.getElementById("progressChart");
  const styles = getComputedStyle(document.documentElement);
  new Chart(ctx, {
    type: "bar",
    data: {
      labels: categories.map(c=>c.category),
      datasets: [
        { label:"Plan %", data: categories.map(c=>c.plan_pct), backgroundColor: styles.getPropertyValue("--steel").trim(), borderRadius:1, maxBarThickness:16 },
        { label:"Actual %", data: categories.map(c=>c.actual_pct), backgroundColor: styles.getPropertyValue("--orange").trim(), borderRadius:1, maxBarThickness:16 },
      ]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display:false } },
      scales: {
        x: { min:0, max:100, grid:{color: styles.getPropertyValue("--line-soft").trim()}, ticks:{font:{size:11}} },
        y: { grid:{display:false}, ticks:{font:{size:12}} }
      }
    }
  });
}

/* Tabs */
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".photo-tabset").forEach(t=>t.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});

loadData().then(render);
</script>
