<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Overview — Site Progress Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbeee4; --surface:#FFFFFF; --band:#f6e1d0;
    --ink:#0e1b3a; --ink-soft:#4a5268;
    --line:#e2ccb8; --line-soft:#f0ded0;
    --navy:#0e1b3a; --navy-deep:#0e1b3a;
    --orange:#f26722; --orange-ink:#a63f0a; --orange-tint:#fdece1;
    --steel:#6b7385; --green:#1f8a4c; --amber:#f26722;
    --radius:10px; --gap:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Archivo', -apple-system, sans-serif;
    font-variant-numeric: tabular-nums; line-height:1.5;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Archivo', sans-serif; font-weight:800; letter-spacing:-0.015em; margin:0;}
  a{color:inherit;}
  button{cursor:pointer; font-family:inherit;}
  ::selection{background:#fbd2b7;}
  button:focus-visible, a:focus-visible, input:focus-visible{outline:2px solid var(--orange); outline-offset:2px;}

  /* header */
  .blueprint{background:var(--ink); position:relative; overflow:hidden;}
  .blueprint::after{content:""; position:absolute; right:-90px; top:-90px; width:320px; height:320px; border:34px solid rgba(242,103,34,0.16); border-radius:50%; pointer-events:none;}
  .bracketed{position:relative;}
  .wrap{max-width:1240px; margin:0 auto; padding:0 28px;}
  .kicker{color:var(--orange); font-size:11px; font-weight:700; letter-spacing:0.1em; margin-bottom:12px;}
  header .wrap{display:flex; align-items:flex-end; justify-content:space-between; padding:44px 28px 34px; flex-wrap:wrap; gap:18px; position:relative; z-index:1;}
  header h1{color:#fff; font-size:52px; line-height:0.98; letter-spacing:-0.03em;}
  header h1::after{content:""; display:block; width:96px; height:6px; background:var(--orange); margin-top:20px;}

  .btn{font-family:inherit; font-size:13px; font-weight:700; padding:8px 14px; border-radius:8px; border:1px solid transparent; cursor:pointer;}
  .btn-outline{background:#fff; color:var(--ink); border-color:var(--line); text-decoration:none; display:inline-flex; align-items:center;}
  .btn-outline:hover{border-color:var(--orange); color:var(--orange-ink);}
  .btn-primary{background:#fff; color:var(--orange-ink); border-color:var(--orange);}
  .btn-primary:hover{background:var(--orange-tint);}
  .back-link{
    font-family:inherit; font-size:13px; font-weight:700; padding:8px 14px; border-radius:8px;
    border:1px solid #fff; background:#fff; color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:6px;
  }
  .back-link:hover{border-color:var(--orange); color:var(--orange-ink);}

  main{padding:22px 0 60px;}

  /* aggregate panel */
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:0; overflow:hidden;}
  .panel-title{
    font-size:14px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase;
    display:flex; align-items:center; justify-content:space-between;
    margin:0; padding:14px 20px; border-bottom:1px solid var(--line-soft);
  }
  .panel-title .title-left{display:flex; align-items:center; gap:8px;}
  .panel-title .tick{width:8px; height:8px; background:var(--orange); border-radius:50%; flex:none;}
  .aggregate-row{display:flex; align-items:center; gap:36px; flex-wrap:wrap; padding:20px;}
  .aggregate-stats{display:flex; gap:0; flex-wrap:wrap;}
  .aggregate-stat{padding:4px 28px; border-left:1px solid var(--line-soft);}
  .aggregate-stat:first-child{border-left:0; padding-left:0;}
  .aggregate-stat .num{font-family:'Archivo', sans-serif; font-size:34px; font-weight:800; line-height:1.05; letter-spacing:-0.02em;}
  .aggregate-stat .lbl{font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--orange-ink); margin-top:6px;}

  .ring-wrap{position:relative; flex:none;}
  .ring-wrap svg{display:block; transform:rotate(-90deg);}
  .ring-track{fill:none; stroke:var(--line-soft);}
  .ring-fill{fill:none; stroke:var(--green); stroke-linecap:butt; transition:stroke-dashoffset 0.6s ease;}
  .ring-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Archivo', sans-serif; font-weight:800; color:var(--ink);}

  /* business unit tabs */
  .bu-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-top:var(--gap);}
  .bu-tab{
    font-family:inherit; font-size:12.5px; font-weight:700; letter-spacing:0.03em; padding:8px 16px;
    border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  }
  .bu-tab:hover{border-color:var(--orange); color:var(--orange-ink);}
  .bu-tab.active{background:var(--ink); border-color:var(--ink); color:#fff;}
  .bu-tab .count{opacity:0.65; margin-left:4px;}

  /* portfolio list */
  .portfolio-list{background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-top:14px; overflow:hidden;}
  .list-row{
    display:grid; align-items:center; gap:14px; padding:14px 20px; border-top:1px solid var(--line-soft);
    grid-template-columns: 2fr 1fr 1.4fr 1fr 1.1fr 0.9fr 0.9fr auto;
  }
  .list-row:first-child{border-top:0;}
  .list-row:hover{background:var(--orange-tint);}
  .list-head{
    font-size:10.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--steel);
    padding:12px 20px; background:var(--band);
  }
  .list-outlet{min-width:0;}
  .list-outlet h3{font-size:14.5px; line-height:1.2;}
  .list-outlet .code{font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--steel); margin-top:2px;}
  .list-cell{font-size:13px; font-weight:600;}
  .list-cell.muted{color:var(--ink-soft); font-weight:500;}
  .status-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    padding:4px 9px; border-radius:4px; border:0; background:var(--orange); color:#fff;
  }
  .status-chip .dot{width:6px; height:6px; border-radius:50%; background:#fff; flex:none;}
  .status-chip.ok{background:var(--green); color:#fff;}
  .status-chip.ok .dot{background:#fff;}
  .status-chip.complete{background:var(--steel); color:#fff;}
  .status-chip.complete .dot{background:#fff;}

  .empty-state, .error-note{font-size:13px; color:var(--ink-soft); padding:30px 0; text-align:center;}
  .error-note{color:var(--orange-ink);}

  /* add outlet modal */
  .settings-overlay{display:none; position:fixed; inset:0; z-index:100; background:rgba(14,27,58,0.55); align-items:center; justify-content:center; padding:24px;}
  .settings-overlay.open{display:flex;}
  .settings-modal{background:var(--surface); width:100%; max-width:440px; border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .settings-modal-header{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:3px solid var(--orange); background:var(--ink); color:#fff;}
  .settings-modal-header h3{font-size:16px;}
  .settings-close{background:transparent; border:none; color:#fff; font-size:22px; line-height:1; padding:0 4px;}
  .settings-modal-body{padding:20px;}
  .settings-modal-hint{font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;}
  .add-outlet-form{display:flex; flex-direction:column; gap:10px;}
  .add-outlet-form input{padding:9px 11px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:13.5px;}
  .add-outlet-form button{margin-top:4px;}

  @media (max-width: 760px){
    .wrap{padding:0 16px;}
    header .wrap{padding:30px 16px 26px; align-items:flex-start;}
    .blueprint::after{width:200px; height:200px; right:-70px; top:-70px; border-width:24px;}
    header h1{font-size:36px;}
    .aggregate-row{gap:20px; padding:16px;}
    .aggregate-stats{width:100%;}
    .aggregate-stat{flex:1 1 0; padding:4px 12px; min-width:0;}
    .aggregate-stat .num{font-size:24px;}
    .aggregate-stat .lbl{font-size:10px;}
    .list-row, .list-head{grid-template-columns:1fr; gap:4px; padding:14px 16px;}
    .list-head{display:none;}
    .list-cell::before{content:attr(data-label); display:block; font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--steel); margin-bottom:2px;}
    .settings-modal{max-width:none;}
  }
</style>
</head>
<body>

<header class="blueprint">
  <div class="wrap">
    <div>
      <div class="kicker">SITE PROGRESS DASHBOARD</div>
      <h1>Portfolio overview</h1>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="back-link" id="addOutletBtn" type="button">+ Add outlet</button>
      <a class="back-link" href="index.html">← Back to dashboard</a>
    </div>
  </div>
</header>

<main class="wrap">

  <div class="panel bracketed">
    <div class="panel-title"><span class="title-left"><span class="tick"></span>Overall portfolio progress</span></div>
    <div class="aggregate-row">
      <div class="ring-wrap" id="aggregateRingWrap"></div>
      <div class="aggregate-stats">
        <div class="aggregate-stat"><div class="num" id="aggOutlets">—</div><div class="lbl">Outlets tracked</div></div>
        <div class="aggregate-stat"><div class="num" id="aggItems">—</div><div class="lbl">Checklist items complete</div></div>
        <div class="aggregate-stat"><div class="num" id="aggPct">—</div><div class="lbl">Combined completion</div></div>
      </div>
    </div>
  </div>

  <div id="buTabs" class="bu-tabs"></div>

  <div id="portfolioList" class="portfolio-list"></div>
  <div id="emptyState" class="empty-state" style="display:none;">No outlets yet — add one below.</div>
  <div id="errorNote" class="error-note" style="display:none;"></div>

</main>

<div class="settings-overlay" id="addOutletOverlay">
  <div class="settings-modal">
    <div class="settings-modal-header">
      <h3>Add outlet</h3>
      <button class="settings-close" id="addOutletCloseBtn" type="button">×</button>
    </div>
    <div class="settings-modal-body">
      <p class="settings-modal-hint">Seeded from TOFU G - 1 Utama's current checklist (internal and external items, in order).</p>
      <div class="add-outlet-form">
        <input type="text" id="newOutletName" placeholder="Outlet name (e.g. Riverside Mall)">
        <input type="text" id="newOutletCode" placeholder="Code (optional)">
        <button class="btn btn-primary" id="addOutletSubmitBtn" type="button">+ Add outlet</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
const SUPABASE_URL = "https://ybwmhxyiaannlnymoytz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nv5KuSnWyIozyV8ZaGzUVA_Jv2DCVXD";
const OUTLET_STORAGE_KEY = "tofuDashboardOutletId"; // must match dashboard.html

let supabase = null;
async function getClient(){
  if(supabase) return supabase;
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return null;
  const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
  supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return supabase;
}

/* ---- helpers shared in spirit with dashboard.html ---- */
function esc(s){
  return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString("en-GB",{day:"numeric", month:"short", year:"numeric"});
}
function isItemDone(c){
  if(c.has_subchecklist) return (c.subitems && c.subitems.length > 0) && c.subitems.every(s => s.checked);
  return !!c.checked;
}
function itemPct(c){
  if(c.has_subchecklist) return (c.subitems && c.subitems.length) ? Math.round(100 * c.subitems.filter(s=>s.checked).length / c.subitems.length) : 0;
  return c.checked ? 100 : 0;
}

/* ---- ring markup ---- */
function ringSvg(pct, size, stroke){
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="ring-track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"></circle>
      <circle class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"
        style="stroke-dasharray:${c};stroke-dashoffset:${offset};"></circle>
    </svg>
    <div class="ring-pct" style="font-size:${Math.round(size*0.2)}px;">${pct}%</div>`;
}

/* ---- data loading ---- */
async function loadPortfolio(){
  const client = await getClient();
  if(!client) return [];
  const { data: projects, error: pErr } = await client.from("projects").select("*").order("name");
  if(pErr) throw pErr;
  if(!projects || !projects.length) return [];

  const ids = projects.map(p => p.id);
  const [{ data: checklist, error: cErr }, { data: info, error: infoErr }] = await Promise.all([
    client.from("checklist_items").select("*").in("project_id", ids),
    client.from("project_info").select("*").in("project_id", ids),
  ]);
  if(cErr) throw cErr;
  if(infoErr) console.warn("Couldn't load project_info:", infoErr.message || infoErr);

  const checklistBy = {};
  (checklist || []).forEach(c => (checklistBy[c.project_id] ||= []).push(c));
  const infoBy = {};
  (info || []).forEach(f => (infoBy[f.project_id] ||= []).push(f));

  const today = new Date(); today.setHours(0,0,0,0);
  const statusUpdates = [];
  projects.forEach(p => {
    if(p.status === "behind") p.status = "delayed"; // legacy value
    if(p.status === "complete") return;
    const isOverdue = [p.target_live, p.original_target_live].some(d => {
      if(!d) return false;
      const dt = new Date(d);
      return !isNaN(dt) && dt < today;
    });
    if(isOverdue && p.status !== "delayed"){
      p.status = "delayed";
      statusUpdates.push(p.id);
    }
  });
  if(statusUpdates.length){
    client.from("projects").update({status:"delayed"}).in("id", statusUpdates)
      .then(({error}) => { if(error) console.warn("Couldn't auto-update status:", error.message || error); });
  }

  return projects.map(p => {
    const items = checklistBy[p.id] || [];
    const total = items.length;
    const pct = total ? Math.round(items.reduce((s,c) => s + itemPct(c), 0) / total) : 0;
    const doneCount = items.filter(isItemDone).length;
    const fields = infoBy[p.id] || [];
    const capex = findInfoField(fields, ["capex"]);
    const sqft = findInfoField(fields, ["sq ft", "sq. ft", "sqft", "square feet", "square footage"]);
    const businessUnit = findInfoField(fields, ["business unit", "business-unit", "segment"]);
    return { project: p, pct, doneCount, total, capex, sqft, businessUnit };
  });
}

/* Looks up an extra info row (see index.html's "infoExtra" editor) by
   matching its label against a set of keywords, so this card shows
   whatever an outlet's own field is called (e.g. "Capex", "CapEx (RM)"). */
function findInfoField(fields, keywords){
  const hit = fields.find(f => keywords.some(k => (f.label || "").toLowerCase().includes(k)));
  return hit ? hit.value : null;
}

/* Business units an outlet can be tagged under — set per outlet via an
   "extra info" row (label "Business unit") in index.html's editor, same
   mechanism as Capex/Sq ft. Matched case-insensitively; anything that
   doesn't match one of these falls into "Unassigned". */
const BUSINESS_UNITS = ["F&B: Chicken", "F&B: Non Chicken", "F&B: Desserts", "Salons & Wellness"];
function normalizeBusinessUnit(value){
  const match = BUSINESS_UNITS.find(bu => bu.toLowerCase() === (value || "").trim().toLowerCase());
  return match || "Unassigned";
}

/* ---- add outlet (seeded from TOFU G - 1 Utama's current checklist) ---- */
const TEMPLATE_OUTLET_NAME = "tofu g - 1 utama";

/* Deep-clones a template outlet's sub-items for a new outlet, preserving
   nested sub-checklists at any depth (but resetting checked state,
   assignees, and dates — a fresh outlet starts with everything unchecked,
   unassigned, and with no due/completed dates of its own). show_assignee
   and show_due_date are copied as explicitly set (or left unset to fall
   back to their parent's resolved default), same as the source. */
function cloneTemplateSubitems(subitems){
  return (subitems || []).map(s => ({
    label: s.label,
    checked: false,
    assignee: null,
    show_assignee: (s.show_assignee !== undefined && s.show_assignee !== null) ? s.show_assignee : null,
    due_date: null,
    completed_date: null,
    show_due_date: (s.show_due_date !== undefined && s.show_due_date !== null) ? s.show_due_date : null,
    has_subchecklist: !!s.has_subchecklist,
    subitems: cloneTemplateSubitems(s.subitems)
  }));
}

async function getTemplateChecklist(){
  const template = portfolio.find(x => (x.project.name || "").trim().toLowerCase() === TEMPLATE_OUTLET_NAME);
  if(!template) return [];
  try{
    const client = await getClient();
    const { data, error } = await client.from("checklist_items")
      .select("*").eq("project_id", template.project.id).order("sort_order");
    if(error) throw error;
    return (data || []).map((c,i) => ({
      label: c.label,
      has_subchecklist: !!c.has_subchecklist,
      subitems: cloneTemplateSubitems(c.subitems),
      drive_link: null,
      list: c.list === "external" ? "external" : "internal",
      sort_order: i
    }));
  }catch(err){
    console.warn("Couldn't load TOFU G - 1 Utama's checklist as a template:", err.message || err);
    return [];
  }
}

function openAddOutlet(){ document.getElementById("addOutletOverlay").classList.add("open"); }
function closeAddOutlet(){
  document.getElementById("addOutletOverlay").classList.remove("open");
  document.getElementById("newOutletName").value = "";
  document.getElementById("newOutletCode").value = "";
}

async function addOutlet(){
  const nameInput = document.getElementById("newOutletName");
  const codeInput = document.getElementById("newOutletCode");
  const name = nameInput.value.trim();
  if(!name){ alert("Give the outlet a name first."); return; }
  const btn = document.getElementById("addOutletSubmitBtn");
  btn.disabled = true;
  try{
    const client = await getClient();
    if(!client) throw new Error("Supabase isn't configured.");
    const { data, error } = await client.from("projects")
      .insert({ name, code: codeInput.value.trim() || null, status: "on_track" })
      .select("id,name,code").single();
    if(error) throw error;

    const template = await getTemplateChecklist();
    if(template.length){
      const rows = template.map((c,i) => {
        const list = c.list || "internal";
        return {
          project_id: data.id, label: c.label, checked: false,
          has_subchecklist: !!c.has_subchecklist, subitems: c.subitems || [],
          // A new outlet's PARENT (top-level) tasks start with both the
          // person icon and the link icon off — either can be turned back on
          // per item in edit mode. Sub-items keep showing their person icon
          // and calendar icon (see cloneTemplateSubitems).
          drive_link: null, list, sort_order: i, show_assignee: false, show_drive_link: false
        };
      });
      const { error: clErr } = await client.from("checklist_items").insert(rows);
      if(clErr) console.warn("Couldn't seed checklist for new outlet:", clErr.message || clErr);
    }

    closeAddOutlet();
    portfolio = await loadPortfolio();
    renderAggregate();
    renderList();
  }catch(err){
    alert("Couldn't add outlet: " + (err.message || err));
  }finally{
    btn.disabled = false;
  }
}

document.getElementById("addOutletBtn").addEventListener("click", openAddOutlet);
document.getElementById("addOutletCloseBtn").addEventListener("click", closeAddOutlet);
document.getElementById("addOutletOverlay").addEventListener("click", e => {
  if(e.target.id === "addOutletOverlay") closeAddOutlet();
});
document.getElementById("addOutletSubmitBtn").addEventListener("click", addOutlet);

/* ---- rendering ---- */
let portfolio = [];
let activeBU = "All";

function filteredPortfolio(){
  return activeBU === "All" ? portfolio : portfolio.filter(e => normalizeBusinessUnit(e.businessUnit) === activeBU);
}

function buTabsHtml(){
  const tabs = ["All", ...BUSINESS_UNITS];
  return tabs.map(bu => {
    const count = bu === "All" ? portfolio.length : portfolio.filter(e => normalizeBusinessUnit(e.businessUnit) === bu).length;
    return `<button type="button" class="bu-tab ${bu === activeBU ? "active" : ""}" data-bu="${esc(bu)}">${esc(bu)}<span class="count">${count}</span></button>`;
  }).join("");
}

function projectRowHtml(entry){
  const { project: p, pct, doneCount, total, capex, sqft } = entry;
  const statusLabels = { on_track:"On track", delayed:"Delayed", complete:"Complete" };
  const statusClass = p.status === "on_track" ? "ok" : (p.status === "complete" ? "complete" : "");
  const statusLabel = statusLabels[p.status] || "Delayed";
  return `
    <a class="list-row" href="index.html" data-open="${p.id}">
      <div class="list-outlet">
        <h3>${esc(p.name) || "Untitled outlet"}</h3>
        <div class="code">${esc(p.code) || "—"}</div>
      </div>
      <div class="list-cell" data-label="Status"><span class="status-chip ${statusClass}"><span class="dot"></span>${statusLabel}</span></div>
      <div class="list-cell muted" data-label="Construction period">${fmtDate(p.period_start)} – ${fmtDate(p.period_end)}</div>
      <div class="list-cell muted" data-label="Opening date">${fmtDate(p.target_live)}</div>
      <div class="list-cell" data-label="Checklist">${doneCount} / ${total} (${pct}%)</div>
      <div class="list-cell" data-label="Capex">${capex ? esc(capex) : "—"}</div>
      <div class="list-cell" data-label="Sq ft">${sqft ? esc(sqft) : "—"}</div>
      <div class="list-cell muted">→</div>
    </a>`;
}

function renderAggregate(){
  const wrap = document.getElementById("aggregateRingWrap");
  const totalItems = portfolio.reduce((s,e) => s + e.total, 0);
  const doneItems = portfolio.reduce((s,e) => s + e.doneCount, 0);
  const pct = totalItems ? Math.round(portfolio.reduce((s,e) => s + (e.pct * e.total), 0) / totalItems) : 0;

  wrap.innerHTML = ringSvg(pct, 130, 14);
  document.getElementById("aggOutlets").textContent = portfolio.length;
  document.getElementById("aggItems").textContent = `${doneItems} / ${totalItems}`;
  document.getElementById("aggPct").textContent = pct + "%";
}

function renderList(){
  document.getElementById("buTabs").innerHTML = buTabsHtml();
  const rows = filteredPortfolio();
  const head = `
    <div class="list-head list-row">
      <div>Outlet</div><div>Status</div><div>Construction period</div><div>Opening date</div>
      <div>Checklist</div><div>Capex</div><div>Sq ft</div><div></div>
    </div>`;
  document.getElementById("portfolioList").innerHTML = rows.length
    ? head + rows.map(projectRowHtml).join("")
    : `<div class="empty-state">No outlets in this business unit.</div>`;
}

document.getElementById("buTabs").addEventListener("click", e => {
  const tab = e.target.closest("[data-bu]");
  if(!tab) return;
  activeBU = tab.dataset.bu;
  renderList();
});

document.getElementById("portfolioList").addEventListener("click", e => {
  const openLink = e.target.closest("[data-open]");
  if(!openLink) return;
  e.preventDefault();
  localStorage.setItem(OUTLET_STORAGE_KEY, openLink.dataset.open);
  window.location.href = "index.html";
});

(async function init(){
  const empty = document.getElementById("emptyState");
  const errorNote = document.getElementById("errorNote");
  try{
    portfolio = await loadPortfolio();
  }catch(err){
    errorNote.textContent = "Couldn't load the portfolio: " + (err.message || err);
    errorNote.style.display = "block";
    document.getElementById("aggregateRingWrap").innerHTML = ringSvg(0, 130, 14);
    return;
  }
  if(!portfolio.length){
    empty.style.display = "block";
    document.getElementById("aggregateRingWrap").innerHTML = ringSvg(0, 130, 14);
    document.getElementById("aggOutlets").textContent = "0";
    document.getElementById("aggItems").textContent = "0 / 0";
    document.getElementById("aggPct").textContent = "0%";
    return;
  }
  renderAggregate();
  renderList();
})();
</script>
</body>
</html>
